<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f4"><meta name="description" content="20 subject adventures. Find the course that sparks your curiosity."><title>The Doorway | 20 course adventures</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#faf8f4;--ink:#23212e;--muted:#6e6b80;--soft:#8f8ca3;--stroke:#e8e4ee;--accent:#6a4fd9;--accent-soft:#efeafb;--panel:#ffffff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c9b8ff;outline-offset:3px}
.noise{display:none}
.shell{max-width:1180px;margin:auto;padding:0 24px}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--stroke)}
.brand{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;display:flex;align-items:center;gap:10px;font-size:16px;text-decoration:none;letter-spacing:.2px}
.brandmark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:19px}
.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.pill{padding:7px 12px;border-radius:50px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.topright button{color:var(--ink);background:transparent;border:1px solid var(--stroke);padding:8px 14px;border-radius:20px}
.topright button:hover{background:#fff}
.hero{padding:64px 0 36px}
.eyebrow{font-size:12px;letter-spacing:1.4px;font-weight:600;color:var(--accent);text-transform:uppercase}
.hero h1{max-width:720px;margin:14px 0 16px;font-family:'Space Grotesk',sans-serif;letter-spacing:-1.5px;line-height:1.1;font-size:clamp(34px,4.6vw,54px);font-weight:600}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:17px;color:var(--muted);line-height:1.7;max-width:600px;margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.stat{border-radius:12px;padding:8px 13px;background:#fff;border:1px solid var(--stroke);font-size:13px;color:var(--muted)}
.stat strong{color:var(--ink);font-weight:600}
.highlight{color:#9a5b12;background:#fff6e8;border-color:#f3dfc0}
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:16px 0 24px}
.search{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--stroke);border-radius:14px;background:#fff;min-width:min(100%,320px);flex:1;color:var(--soft)}
.search input{border:0;outline:0;background:transparent;color:var(--ink);min-width:40px;width:100%}
.search input::placeholder{color:var(--soft)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{border:1px solid var(--stroke);border-radius:20px;color:var(--muted);background:#fff;padding:8px 13px;font-size:12px;font-weight:600}
.filter.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sectionhead h2{font-size:16px;font-weight:600;margin:0}
.sectionhead span{font-size:12px;color:var(--soft)}
.doorgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 16px;padding-bottom:48px}
.doorcard{border-radius:18px;border:1px solid var(--stroke);padding:12px;background:var(--panel);min-width:0;position:relative;transition:transform .2s,box-shadow .2s;overflow:hidden}
.doorcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px #2a204010}
.doortap{display:block;width:100%;background:none;color:inherit;border:0;padding:0;text-align:left}
.doorvisual{height:210px;border-radius:12px;display:grid;place-items:center;position:relative;background:color-mix(in srgb,var(--c),white 86%);overflow:hidden}
.doorframe{position:relative;height:160px;width:112px;border-radius:56px 56px 8px 8px;padding:6px;background:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--c),transparent 70%);transition:transform .3s}
.doorcard:hover .doorframe{transform:translateY(-3px)}
.doorpanel{height:100%;width:100%;border-radius:50px 50px 4px 4px;background:color-mix(in srgb,var(--c),white 10%);display:flex;align-items:center;justify-content:center;position:relative}
.doorpanel::before{content:'';position:absolute;inset:14px 11px 26px;border:1.5px solid #ffffff66;border-radius:40px 40px 2px 2px}
.doorpanel .em{font-size:48px;z-index:1}
.knob{width:8px;height:8px;border-radius:50%;position:absolute;right:9px;top:98px;background:#ffe3a3}
.doorindex{position:absolute;top:12px;left:13px;font-size:11px;font-weight:600;letter-spacing:.8px;color:color-mix(in srgb,var(--c),black 35%)}
.doorfoot{display:none}
.cardmeta{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:14px 1px 6px}
.cardmeta span{font-size:11px;letter-spacing:.8px;color:var(--soft);font-weight:600}
.smalltag{font-size:10px;background:#fff6e8;color:#9a5b12;padding:4px 8px;border-radius:10px}
.ctitle{margin:0 1px;font:600 18px/1.2 'Space Grotesk',sans-serif;letter-spacing:-.3px;min-height:44px;color:var(--ink)}
.cname{color:var(--muted);font-size:12.5px;line-height:1.5;margin:6px 1px 4px;min-height:36px}
.cardbottom{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font-size:12px;font-weight:600;margin-top:10px}
.heart{position:absolute;top:18px;right:18px;border:0;color:#b8b4c8;background:#ffffffcc;border-radius:50%;width:32px;height:32px;font-size:17px;line-height:1;padding:0}
.heart.active{color:#e4588e}
.notfor{color:#9a5b12!important}
.empty{padding:65px 0;text-align:center;color:var(--soft)}
.footer{border-top:1px solid var(--stroke);padding:24px 0 40px;color:var(--soft);font-size:12px;line-height:1.7}
.footer a{color:var(--accent)}
.course{--theme:#6a4fd9;min-height:100vh;background:var(--bg)}
.course .coursebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}
.back{border:1px solid var(--stroke);border-radius:40px;background:#fff;padding:9px 15px;color:var(--ink);font-weight:600;font-size:13px}
.navsmall{color:var(--soft);font-size:12px}
.navsmall button{margin-left:5px;background:#fff;color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:7px 11px}
.navsmall button:disabled{opacity:.3;cursor:not-allowed}
.coursehero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:36px;padding:24px 0 28px}
.coursehero h1{font:600 clamp(32px,4.4vw,52px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-1.2px;margin:12px 0 10px;color:var(--ink)}
.subtitle{color:var(--muted);font-size:16px;margin-bottom:14px}
.bigquestion{font-size:18px;line-height:1.6;max-width:600px;color:var(--ink)}
.warning{margin-top:16px;display:inline-block;border:1px solid #f3dfc0;border-radius:12px;background:#fff6e8;padding:12px 15px;color:#7a4a0e;font-size:13px;line-height:1.5}
.coursehero img{width:100%;aspect-ratio:900 / 580;object-fit:cover;border-radius:18px;border:1px solid var(--stroke)}
.detailchips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.detailchips span{font-size:12px;border:1px solid var(--stroke);border-radius:40px;padding:7px 12px;background:#fff;color:var(--muted)}
.coursebody{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr);gap:20px;padding:8px 0 72px}
.contentbox{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:24px 26px;margin-bottom:18px;overflow:hidden}
.contentbox h2{font:600 21px 'Space Grotesk',sans-serif;letter-spacing:-.4px;margin:0 0 10px;color:var(--ink)}
.contentbox p{color:var(--muted);line-height:1.75;font-size:15px;margin:0}
.weeklist{display:grid;gap:10px;margin-top:18px}
.week{border-radius:12px;background:var(--bg);padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.weeknum{display:grid;place-items:center;background:color-mix(in srgb,var(--theme),white 82%);color:color-mix(in srgb,var(--theme),black 25%);border-radius:10px;min-width:36px;height:36px;font-weight:600;font-size:13px}
.week p{font-size:14px;line-height:1.6;color:var(--ink)}
.minihead{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:600;margin-bottom:8px}
.activity{background:color-mix(in srgb,var(--theme),white 90%);border-color:color-mix(in srgb,var(--theme),white 70%)}
.activity p{color:var(--ink);font-size:16px}
.callout{display:flex;align-items:flex-start;gap:12px}
.callouticon{font-size:22px;flex-shrink:0}
.external{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:11px 16px;text-decoration:none;font-weight:600;border-radius:12px;font-size:13px;margin-top:14px}
.quote{font-family:'Space Grotesk',sans-serif;font-size:19px;color:var(--ink);line-height:1.45;letter-spacing:-.3px;margin:14px 0 0;padding-left:14px;border-left:3px solid color-mix(in srgb,var(--theme),white 50%)}
.sidebar .contentbox{margin-bottom:18px}
.fineprint{font-size:12px;color:var(--soft);line-height:1.6;margin-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,110px);transition:transform .25s;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;z-index:10;box-shadow:0 10px 35px #0003}
.toast.show{transform:translate(-50%,0)}
.no-results{grid-column:1/-1}
.skip{position:absolute;left:-10000px}
.skip:focus{left:15px;top:15px;background:#fff;color:#000;z-index:100;padding:10px}
.progressbar{height:4px;background:#00000010;border-radius:5px;margin-top:14px;overflow:hidden}
.progressbar>div{height:100%;background:var(--theme);transition:width .2s}
.donebtn{background:#fff;color:var(--ink);border:1px solid var(--stroke);padding:10px 14px;border-radius:12px;font-weight:600;margin-top:12px;font-size:13px}
.donebtn.done{background:#e3f6e9;color:#1f5a33;border-color:#bfe6cc}
.hint{font-size:12px!important;color:var(--soft)!important}
@media(max-width:1020px){.doorgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.coursehero{grid-template-columns:1fr 1fr;gap:22px}}
@media(max-width:720px){.shell{padding:0 16px}.hero{padding:44px 0 28px}.doorgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.doorcard{padding:9px;border-radius:14px}.doorvisual{height:160px}.doorframe{height:122px;width:86px;border-radius:43px 43px 6px 6px}.doorpanel{border-radius:38px 38px 3px 3px}.doorpanel .em{font-size:36px}.doorpanel:before{inset:10px 8px 20px;border-radius:30px 30px 2px 2px}.knob{top:74px;right:7px}.ctitle{font-size:16px;min-height:38px}.cname{font-size:11.5px}.coursehero{grid-template-columns:1fr;padding-top:16px}.coursebody{grid-template-columns:1fr}.contentbox{padding:20px}.topright .pill{display:none}.navsmall{font-size:0}.navsmall button{font-size:14px}.coursehero img{max-height:280px}.bar{align-items:stretch}.filters{width:100%}.filter{font-size:11px;padding:7px 10px}}
@media(max-width:410px){.doorgrid{gap:10px}.doorindex{font-size:9px}.topbar{height:60px}.ctitle{font-size:15px}.hero p{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><a href="#main" class="skip">Skip to courses</a><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
const courses=[{"code": "ds", "name": "Introduction to Data Science and AI", "hook": "AI DETECTIVE", "tag": "Teach a computer to recognise patterns instead of giving it every answer.", "goal": "Spot patterns in shopping data, flowers, handwritten digits and messages.", "road": ["W1 to 2: Collect data; turn images and words into numbers.", "W3 to 4: Discover supervised, unsupervised and sequential learning; group similar items.", "W5 to 6: Try nearest neighbours, decision trees and neural networks; classify images.", "W7 to 8: See how feedback helps AI improve in questions, healthcare and robots."], "task": "Make a mini “sort the mystery objects” game: choose three features, then group objects by similarity.", "friction": "If “feature engineering” sounds scary, read it as choosing clues that matter.", "difficulty": "Medium", "category": "AI & DATA", "emoji": "🧠", "world": "AI that identifies animals in camera photos, music recommendations, and systems that flag suspicious transactions.", "scene": "Try spotting what makes two images similar. That is the beginning of teaching a computer to recognise patterns.", "kind": "Tech", "level": "curious", "color": "#7956ff", "index": 1, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ds", "image": "assets/ds.svg"}, {"code": "es", "name": "Introduction to Electronic Systems", "hook": "PHONE X-RAY", "tag": "Find out what is happening inside the phone and charger you use every day.", "goal": "Understand batteries, voltage, electrical signals, motors and power use.", "road": ["W1 to 2: Peek inside a phone and read battery/charger labels.", "W3 to 4: Learn voltage, current, resistance and power.", "W5 to 6: Explore motors, microphones, generators and changing signals.", "W7 to 8: Understand signal energy, harmonics and electricity bills."], "task": "Compare the wattage and voltage printed on two chargers (no opening or electrical experiments).", "friction": "The maths of waves and signals may feel unfamiliar; begin with phone components.", "difficulty": "Medium–high", "category": "GADGETS", "emoji": "⚡", "world": "Noise-cancelling headphones, electric cars, wearable heart-rate sensors, and tiny satellites all rely on electronics.", "scene": "Your phone is not magic. It is an orchestra of circuits, sensors, and signals.", "kind": "Tech", "level": "challenging", "color": "#16a5ae", "index": 2, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=es", "image": "assets/es.svg"}, {"code": "ad", "name": "Introduction to Architecture and Design", "hook": "ROOM REMIX", "tag": "Redesign spaces that annoy you: and learn why some rooms just feel right.", "goal": "Play with shapes, colour, proportion, patterns and drawings of spaces.", "road": ["W1 to 2: Notice architecture; build shapes from points and lines.", "W3 to 4: Explore balance, scale and tangram compositions.", "W5 to 6: Study rhythm and patterns; sketch plans, elevations and perspectives.", "W7 to 8: Design logos and jaali patterns; pull a final design together."], "task": "Sketch your dream study corner with one change that makes it easier to use.", "friction": "No need to be “good at art” already; rough sketches count as thinking.", "difficulty": "Low–medium", "category": "DESIGN", "emoji": "🏛️", "world": "Architects create earthquake-aware buildings, shaded public spaces, and small homes that feel twice their size.", "scene": "What would you change about your classroom if you were the architect?", "kind": "Create", "level": "easy", "color": "#fc795e", "index": 3, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ad", "image": "assets/ad.svg"}, {"code": "bs", "name": "Introduction to Engineering Biological Systems", "hook": "BIOLOGY HACK LAB", "tag": "What if living cells could help make medicine or useful materials?", "goal": "Meet cells, microscopes, proteins, DNA and the idea of engineering biology.", "road": ["W1 to 2: Cells, microscopes and virtual biotech-lab tools.", "W3 to 4: How biological products are made; membranes and carbohydrates.", "W5 to 6: Proteins, enzymes, DNA and introductory bioinformatics.", "W7 to 8: PCR, genetic engineering and biological production."], "task": "Draw a “cell factory” that turns ingredients into something useful; label its jobs.", "friction": "DNA amplification, PCR and BLAST are names of tools, not prerequisites.", "difficulty": "Medium–high", "category": "BIOTECH", "emoji": "🧬", "world": "Engineered microbes can produce medicines such as insulin, and bioengineers build tissue models to study diseases.", "scene": "Imagine a tiny factory that is alive. What would you ask it to make?", "kind": "Science", "level": "challenging", "color": "#69b88d", "index": 4, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=bs", "image": "assets/bs.svg"}, {"code": "mc", "name": "Fun with Math and Computing", "hook": "SECRET CODE CLUB", "tag": "How do computers search, keep secrets: and even count votes?", "goal": "Explore binary, fast searching, clever card tricks and cryptography.", "road": ["W1 to 2: Binary and other ways computers represent numbers.", "W3 to 4: Binary search, pattern matching and a 21-card trick.", "W5 to 6: Fair voting and why election rules can be tricky.", "W7 to 8: Codes, number theory and RSA-style security."], "task": "Play “guess my number” from 1 to 64 using yes/no questions; count how few guesses it takes.", "friction": "This is clever maths, not necessarily learning to code an app.", "difficulty": "Medium–high", "category": "MATH & CODE", "emoji": "🔐", "world": "Encryption helps protect private messages, and clever search algorithms find results without checking everything.", "scene": "Crack the trick: Why can seven yes-or-no questions identify a number from 1 to 100?", "kind": "Puzzles", "level": "challenging", "color": "#516ee7", "index": 5, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=mc", "image": "assets/mc.svg"}, {"code": "gp", "name": "Math Unplugged: Games & Puzzles", "hook": "PUZZLE BOSS", "tag": "Chess puzzles, strange infinities and problems that still stump mathematicians.", "goal": "Think through chessboard tours, peg solitaire, infinities and playful proofs.", "road": ["W1 to 2: Try knight tours across differently sized boards.", "W3 to 4: Explore unusual chess moves and peg solitaire.", "W5 to 6: Visit the impossible infinite hotel; compare infinities.", "W7 to 8: Count areas with geometry; peek at unsolved problems."], "task": "Draw a 5×5 grid and see how far a chess knight can travel without repeating a square.", "friction": "Later lessons include graph theory and infinity ideas; getting stuck is normal.", "difficulty": "Medium–high", "category": "PUZZLES", "emoji": "♞", "world": "Puzzle ideas connect to delivery routes, network design, logic games, and mathematical research.", "scene": "Can you solve a board game by finding a clever pattern instead of trying every move?", "kind": "Puzzles", "level": "challenging", "color": "#a478e8", "index": 6, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=gp", "image": "assets/gp.svg"}, {"code": "fe", "name": "The Fundamentals of Aerospace", "hook": "MISSION: MARS", "tag": "Why can planes fly, rockets launch, and satellites stay in orbit?", "goal": "Understand forces, airflow, engines, flight controls and space missions.", "road": ["W1 to 2: Types of aircraft; forces and how air acts on objects.", "W3 to 4: Wings, controls, speed and aircraft/rocket engines.", "W5 to 6: Orbits, a Mars trip, parachutes and safe landing.", "W7 to 8: Spinning wings and further flight applications."], "task": "Fold two paper plane designs and compare how far each flies in a safe open area.", "friction": "Words like drag and Mach number describe things you can first observe.", "difficulty": "Medium", "category": "SPACE & FLIGHT", "emoji": "🚀", "world": "Engineers design reusable rockets, drones for difficult terrain, and spacecraft that navigate between planets.", "scene": "You can test an idea about flight with just a sheet of paper.", "kind": "Science", "level": "curious", "color": "#f18d4c", "index": 7, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=fe", "image": "assets/fe.svg"}, {"code": "hu", "name": "Humanities Unplugged", "hook": "MEME DETECTIVE", "tag": "Can a meme, song or ad change the way you see the world?", "goal": "Decode pop culture, identity, online influence and storytelling.", "road": ["W1 to 2: Spot humanities in films and memes; decode cultural clues.", "W3 to 4: Map your story; trace storytelling from ancient to digital.", "W5 to 6: Analyse media bias, online identity and social change.", "W7 to 8: Connect creative thinking with future directions."], "task": "Choose a favourite meme or ad: what emotion is it trying to trigger?", "friction": "This is about thinking critically, not memorising history dates.", "difficulty": "Low", "category": "CULTURE & MEDIA", "emoji": "🎭", "world": "Film analysts decode visual storytelling, researchers study internet culture, and journalists investigate how narratives spread.", "scene": "A meme is a tiny cultural message. What is yours really saying?", "kind": "Create", "level": "easy", "color": "#e76d9b", "index": 8, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=hu", "image": "assets/hu.svg"}, {"code": "ec", "name": "Introduction to Ecology", "hook": "NATURE TRACKER", "tag": "Become a detective for the plants, birds and tiny creatures around you.", "goal": "Track biodiversity using field observations, maps and real data.", "road": ["W1 to 2: Observe biodiversity, species and local habitats.", "W3 to 4: Create an iNaturalist-style observation project; compare regions.", "W5 to 6: Explore biodiversity data and evolution.", "W7 to 8: Study lizards, genes and the sounds of living things."], "task": "Photograph or sketch three different living things nearby, without disturbing them.", "friction": "Some data analysis uses spreadsheets; the outdoor observation comes first.", "difficulty": "Low–medium", "category": "WILDLIFE", "emoji": "🦋", "world": "Citizen scientists photograph species to help researchers map biodiversity and understand changes in habitats.", "scene": "The area outside your home can become your first research site.", "kind": "Science", "level": "easy", "color": "#58ac6b", "index": 9, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ec", "image": "assets/ec.svg"}, {"code": "fm", "name": "Economics, Finance, and Money Matters", "hook": "MONEY MYTHBUSTERS", "tag": "Why do brands cost more, free things have catches, and prices rise?", "goal": "Explore money, inflation, risk, brands, trade and digital platforms.", "road": ["W1 to 2: Money, value, inflation and brand-price comparisons.", "W3 to 4: Incentives, risks and choices; probability exercises.", "W5 to 6: Trade, market failures and game theory.", "W7 to 8: Digital platforms and how technology changes markets."], "task": "Compare two similar products: what are you paying for besides the item?", "friction": "A little probability comes up, but most questions start in daily life.", "difficulty": "Low–medium", "category": "MONEY", "emoji": "💸", "world": "Economists study why prices change, how apps design incentives, and why people make surprising financial choices.", "scene": "Why do two nearly identical water bottles have wildly different prices?", "kind": "Everyday", "level": "easy", "color": "#eeaa45", "index": 10, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=fm", "image": "assets/fm.svg"}, {"code": "gte", "name": "Game Tech Explorers: Understanding Humans, Machines, and Play", "hook": "BUILD A GAME SUPERPOWER", "tag": "Imagine controlling a game with your voice, hands or body movement.", "goal": "Discover controllers, sensory feedback, game AI, gestures, voice and XR.", "road": ["W1 to 2: Human senses, gaming sensors and rapid feedback.", "W3 to 4: If to then game AI and gestu ies and Challenges", "hook": "INVISIBLE MATERIALS", "tag": "Why can tiny molecules change colour, power screens or improve medicine?", "goal": "Explore how molecules are built and how they make useful materials.", "road": ["W1 to 2: Simple/complex molecules and why things have colours.", "W3: How scientists investigate reactions and interactions.", "W4 to 6: Sensors, displays, medical imaging and solar energy.", "W7 to 8: How to study chemistry and possible careers."], "task": "Pick one colourful object or LED and sketch questions about the materials inside it.", "friction": "Molecular interactions can feel abstract without a chemistry interest.", "difficulty": "High", "category": "MOLECULES", "emoji": "🔬", "world": "Molecular engineering helps develop OLED displays, chemical sensors, battery materials, and advanced medical tools.", "scene": "The smallest building blocks can make the biggest difference in what a material does.", "kind": "Science", "level": "challenging", "color": "#35a4b4", "index": 13, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=mle", "image": "assets/mle.svg"}, {"code": "ics", "name": "Introduction to Cybersecurity", "hook": "DIGITAL BODYGUARD", "tag": "How do hackers trick people: and how can you protect your accounts?", "goal": "Passwords, secret codes, how the internet works and common attacks.", "road": ["Module 1: What cybersecurity protects.", "Module 2: Secrets and cryptography.", "Module 3: Passwords and logging in securely.", "Modules 4 to 5: Internet basics and popular cyberattacks."], "task": "Make a fake phishing-message checklist: identify suspicious links, urgency and strange senders.", "friction": "No hacking experience needed; the website describes about 10 hours of content.", "difficulty": "Low–medium", "category": "CYBER SAFETY", "emoji": "🛡️", "world": "Security teams stop phishing attacks, protect accounts, and build systems that keep personal information private.", "scene": "Could you spot a fake login nds-on work and Saturday live discussion: no conventional lectures.", "difficulty": "Low–medium", "category": "FORENSICS", "emoji": "🔎", "world": "Forensic teams compare fingerprints, study documents, analyse digital traces, and reconstruct what happened at a scene.", "scene": "A clue only helps if you can explain what it proves, and what it does not.", "kind": "Everyday", "level": "easy", "color": "#eaa24a", "index": 16, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ifs", "image": "assets/ifs.svg"}, {"code": "ifs2", "name": "Introduction to Forensic Sciences - II (For Classes XI & XII)", "hook": "FORENSICS CAREER MAP", "tag": "What does a real forensic scientist do all day?", "goal": "Meet forensic careers and learn pathways into lab, biology and other specialisms.", "road": ["W1 to 2: Forensic job families and laboratory career routes.", "W3 to 4: DNA lab and medicine-related pathways.", "W5 to 6: Other professional pathways and evidence-based decisions.", "W7 to 8: Career planning and defending an expert view."], "task": "Compare two forensic jobs: which daily tasks sound more interesting?", "friction": "NOT FOR GRADE 9: the official title restricts this one to Classes XI–XII.", "difficulty": "Not age-appropriate", "category": "CAREERS", "emoji": "🧪", "world": "Forensic specialists work in labs, digital analysis, toxicology, and evidence interpretation.", "scene": "Do you prefer solving the science puzzle or presenting the evidence?", "kind": "Everyday", "level": "older", "color": "#77a7dc", "index": 17, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ifs2", "image": "assets/ifs2.svg"}, {"code": "bddi", "name": "Our Defense System: How Our Body Detects and Defeats Invaders", "hook": "BODY DEFENCE SQUAD", "tag": "Your body has guards, rapid responders and specialists fighting invisible threats.", "goal": "Discover immunity, antibodies, vaccines, immune memory and what goes wrong.", "road": ["Part 1: Body barriers and your fast-response immune team.", "Part 2: Adaptive immunity and antibody specialists.", "Part 3: Vaccines, memory and misfires.", "Part 4: Colds, fever, discoveries and immunology careers."], "task": "Draw the immune system as a game team: shield, scout, fighter and memory keeper.", "friction": "“Innate” means ready-made defence; “adaptive” means a more targeted response.", "difficulty": "Medium", "category": "IMMUNITY", "emoji": "🦠", "world": "Immunologists help develop vaccines, study allergies, and investigate how the body recognises threats.", "scene": "Your body runs its own defence team, even while you are asleep.", "kind": "Science", "level": "curious", "color": "#69bfad", "index": 18, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=bddi", "image": "assets/bddi.svg"}, {"code": "ftnc", "name": "From Statistics to Intelligence (For Classes XI & XII)", "hook": "DATA TRUTH DETECTOR", "tag": "Can averages mislead you? How do prediction apps guess what comes next?", "goal": "Study probability, surveys, misleading charts, prediction and AI.", "road": ["W1 to 2: Chance and biased surveys.", "W3 to 4: Averages, variation and big data patterns.", "W5 to 6: Conditional probability, correlations and predictions.", "W7 to 8: Data science, AI and possible careers."], "task": "Find two charts about the same topic and notice how their scales change the story.", "friction": "NOT FOR GRADE 9: explicitly intended for XI–XII, with advanced statistics.", "difficulty": "Not age-appropriate", "category": "STATISTICS", "emoji": "📊", "world": "Statisticians help forecast demand, spot misleading surveys, and check whether a medical study is convincing.", "scene": "Can one chart tell a lie without containing a single false number?", "kind": "Puzzles", "level": "older", "color": "#6e85ef", "index": 19, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ftnc", "image": "assets/ftnc.svg"}, {"code": "de", "name": "Discover Engineering", "hook": "EVERYDAY INVENTOR", "tag": "Find one thing that bothers people: and engineer a better version.", "goal": "Explore how engineers solve problems with science, creativity and teamwork.", "road": ["W1 to 2: Find engineering in everyday objects and the science inside.", "W3 to 4: Big engineering achievements and human needs.", "W5 to 6: How engineers work; choose a problem worth solving.", "W7 to 8: Develop an idea and present a short video pitch."], "task": "Find an annoying everyday object; explain the problem in 30 seconds before suggesting a fix.", "friction": "The goal is not to know all physics: start by noticing a problem.", "difficulty": "Low–medium", "category": "ENGINEERING", "emoji": "⚙️", "world": "Engineers create clean-water systems, safer roads, assistive technology, and solutions to everyday problems.", "scene": "Engineering begins with the sentence: This could work better.", "kind": "Everyday", "level": "easy", "color": "#f27857", "index": 20, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=de", "image": "assets/de.svg"}];
const state={filter:'All',search:'',favorites:JSON.parse(localStorage.getItem('doorFavorites')||'[]'),explored:JSON.parse(localStorage.getItem('doorExplored')||'[]')};
const kinds=['All','Tech','Create','Science','Puzzles','Everyday','Saved'];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),2300)}
function markSaved(code){let i=state.favorites.indexOf(code);if(i<0)state.favorites.push(code);else state.favorites.splice(i,1);localStorage.setItem('doorFavorites',JSON.stringify(state.favorites));render();toast(i<0?'Saved to your doors':'Removed from saved doors')}
function markDone(code){let i=state.explored.indexOf(code);if(i<0)state.explored.push(code);else state.explored.splice(i,1);localStorage.setItem('doorExplored',JSON.stringify(state.explored));render();toast(i<0?'Marked as explored!':'Marked as not explored')}
function nav(code){location.hash=code?'#/course/'+code:'#/';window.scrollTo({top:0,behavior:'instant'});render()}
function card(c){return `<article class="doorcard" style="--c:${c.color}"><button class="doortap" onclick="nav('${c.code}')" aria-label="Open ${esc(c.name)}"><div class="doorvisual"><span class="doorindex">DOOR ${String(c.index).padStart(2,'0')}</span><div class="doorframe"><div class="doorpanel"><span class="em">${c.emoji}</span><span class="knob"></span></div></div></div><div class="cardmeta"><span>${esc(c.category)}</span>${c.level==='older'?'<span class="smalltag notfor">CLASS XI–XII</span>':''}</div><h3 class="ctitle">${esc(c.hook)}</h3><p class="cname">${esc(c.name)}</p><div class="cardbottom"><span>Open →</span></div></button><button class="heart ${state.favorites.includes(c.code)?'active':''}" onclick="markSaved('${c.code}')" aria-label="${state.favorites.includes(c.code)?'Remove':'Save'} ${esc(c.name)}">${state.favorites.includes(c.code)?'♥':'♡'}</button></article>`}
function header(){return `<header class="shell topbar"><a class="brand" href="#/" onclick="event.preventDefault();nav()"><span class="brandmark">⌁</span> THE DOORWAY <span style="font-size:9px;color:#9a9fb7;letter-spacing:1px">/ SCHOOL CONNECT</span></a><div class="topright"><button onclick="nav()">All courses</button></div></header>`}
function home(){let list=courses.filter(c=>(state.filter==='All'||(state.filter==='Saved'?state.favorites.includes(c.code):state.filter===c.kind))&&(!state.search||[c.hook,c.name,c.tag,c.category,c.goal].join(' ').toLowerCase().includes(state.search.toLowerCase())));app.innerHTML=header()+`<main id="main" class="shell"><section class="hero"><div class="eyebrow">IIT Madras School Connect</div><h1>20 doors. <em>Pick one</em><br>that looks interesting.</h1><p>Each door is an 8-week course explained in plain language. Peek inside, try a tiny activity, and see if the subject clicks. No pressure to love every room.</p><div class="stats"><span class="stat"><strong>20</strong> subjects</span><span class="stat"><strong>8 weeks</strong> each</span><span class="stat highlight">2 courses are for Classes XI–XII</span></div></section><div class="bar"><label class="search">⌕ <input type="search" id="search" placeholder="Search a vibe, hobby or subject..." value="${esc(state.search)}" oninput="updateSearch(this.value)" aria-label="Search courses"></label><div class="filters" role="group" aria-label="Course filters">${kinds.map(k=>`<button class="filter ${state.filter===k?'on':''}" onclick="setFilter('${k}')">${k==='Saved'?'♡ ':''}${k}</button>`).join('')}</div></div><div class="sectionhead"><h2 id="resulthead">Choose a door</h2><span id="resultcount">${list.length} of 20 showing</span></div><section class="doorgrid" id="doorgrid" aria-label="Course doors">${list.length?list.map(card).join(''):'<div class="empty no-results">No doors match that search. Try something else.</div>'}</section><div class="contentbox" style="margin-bottom:35px"><div class="minihead">A note for parents</div><p>This is a friendly guide to help a Grade 9 student discover interests, not a replacement for official course requirements. Two courses are labelled for Classes XI–XII, and some subjects are more technical than others. Follow the official page links before enrolling. The real-world examples are illustrations of the field, not projects promised by the course.</p></div></main>`+footer();}
function updateSearch(v){state.search=v;let list=courses.filter(c=>(state.filter==='All'||(state.filter==='Saved'?state.favorites.includes(c.code):state.filter===c.kind))&&(!state.search||[c.hook,c.name,c.tag,c.category,c.goal].join(' ').toLowerCase().includes(state.search.toLowerCase())));document.getElementById('doorgrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty no-results">No doors match that search. Try something else.</div>';document.getElementById('resultcount').textContent=list.length+' of 20 showing'}
function setFilter(k){state.filter=k;home();document.querySelector('#search')?.focus({preventScroll:true})}
function footer(){return `<footer class="shell footer">Made for exploring, not cramming. Based on the provided IIT Madras School Connect course list and course guide. Course information should be confirmed on the <a href="https://code.iitm.ac.in/schoolconnect/" target="_blank" rel="noopener">official website</a>. Individual pages include official links. All artwork is included locally. ✦</footer>`}
function detail(c){let i=courses.findIndex(x=>x.code===c.code),prev=courses[i-1],next=courses[i+1],warnings=c.level==='older'?`<div class="warning">⚠️ This course is specifically labelled for Classes XI–XII. It is shown for comparison, but is not intended for a Grade 9 student.</div>`:c.code==='ipd'?`<div class="warning">⚠️ The course page describes senior-secondary learners while general eligibility includes IX–XII. Check with the programme before registering.</div>`:'';app.innerHTML=`<div class="course" style="--theme:${c.color}">${header()}<main id="main" class="shell"><div class="coursebar"><button class="back" onclick="nav()">← All courses</button><div class="navsmall">DOOR ${c.index} OF 20 <button ${!prev?'disabled':''} onclick="nav('${prev?prev.code:c.code}')" aria-label="Previous course">←</button><button ${!next?'disabled':''} onclick="nav('${next?next.code:c.code}')" aria-label="Next course">→</button></div></div><section class="coursehero"><div><div class="eyebrow">${esc(c.category)} · 8 weeks</div><h1>${esc(c.hook)}</h1><div class="subtitle">${esc(c.name)}</div><p class="bigquestion">${esc(c.tag)}</p><div class="detailchips"><span>📅 8 weeks</span><span>🧭 ${esc(c.difficulty)}</span><span>${c.level==='older'?'⚠️ Grades 11–12':'✨ Explore at your pace'}</span></div>${warnings}</div><img src="${c.image}" alt="Illustrated artwork featuring ${esc(c.emoji)} for ${esc(c.name)}"></section><section class="coursebody"><div><article class="contentbox"><div class="minihead">What it is about</div><h2>The short version</h2><p>${esc(c.goal)}</p><div class="quote">“${esc(c.scene)}”</div></article><article class="contentbox"><div class="minihead">Week by week</div><h2>What you'll explore</h2><p>The course content in plain language. Some courses group topics into modules rather than exact two-week blocks.</p><div class="weeklist">${c.road.map((s,j)=>`<div class="week"><span class="weeknum">${String(j+1).padStart(2,'0')}</span><p>${esc(s)}</p></div>`).join('')}</div></article><article class="contentbox activity"><div class="minihead">Try it first</div><h2>A 10-minute mini activity</h2><p>${esc(c.task)}</p><button class="donebtn ${state.explored.includes(c.code)?'done':''}" onclick="markDone('${c.code}')">${state.explored.includes(c.code)?'✓ Explored this door':'✓ I tried this!'}</button><div class="progressbar"><div style="width:${state.explored.length/20*100}%"></div></div><p class="hint" style="margin-top:9px">${state.explored.length} of 20 subjects explored. Your progress stays in this browser.</p></article></div><aside class="sidebar"><article class="contentbox"><div class="minihead">Out in the world</div><h2>Where this shows up in real life</h2><p>${esc(c.world)}</p><p class="fineprint">These are real-world examples of the field, not specific course project promises.</p></article><article class="contentbox"><div class="minihead">Tricky words</div><h2>Decoded</h2><div class="callout"><div class="callouticon">💡</div><p>${esc(c.friction)}</p></div></article><article class="contentbox"><button class="donebtn ${state.favorites.includes(c.code)?'done':''}" onclick="markSaved('${c.code}')">${state.favorites.includes(c.code)?'♥ Saved to favorites':'♡ Save this course'}</button></article><article class="contentbox"><div class="minihead">Official information</div><p>For the exact syllabus, teacher, enrolment eligibility, deadlines, assessment and certificate details, use the IIT Madras course page.</p><a class="external" target="_blank" rel="noopener" href="${c.link}">View official course ↗</a></article></aside></section></main>${footer()}</div>`;document.title=c.hook+' | The Doorway'}
function render(){let m=location.hash.match(/^#\/course\/([\w]+)$/);let c=m?courses.find(x=>x.code===m[1]):null;if(c)detail(c);else{document.title='The Doorway | 20 course adventures';home()}}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});render();
</script></body></html>
