const courses=[{"code": "ds", "name": "Introduction to Data Science and AI", "hook": "AI DETECTIVE", "tag": "Teach a computer to recognise patterns instead of giving it every answer.", "goal": "Spot patterns in shopping data, flowers, handwritten digits and messages.", "road": ["W1 to 2: Collect data; turn images and words into numbers.", "W3 to 4: Discover supervised, unsupervised and sequential learning; group similar items.", "W5 to 6: Try nearest neighbours, decision trees and neural networks; classify images.", "W7 to 8: See how feedback helps AI improve in questions, healthcare and robots."], "task": "Make a mini “sort the mystery objects” game: choose three features, then group objects by similarity.", "friction": "If “feature engineering” sounds scary, read it as choosing clues that matter.", "difficulty": "Medium", "verdict": "Strong if curious about AI; some new vocabulary.", "category": "AI & DATA", "emoji": "🧠", "world": "AI that identifies animals in camera photos, music recommendations, and systems that flag suspicious transactions.", "scene": "Try spotting what makes two images similar. That is the beginning of teaching a computer to recognise patterns.", "kind": "Tech", "level": "curious", "color": "#7956ff", "index": 1, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ds", "image": "assets/ds.svg"}, {"code": "es", "name": "Introduction to Electronic Systems", "hook": "PHONE X-RAY", "tag": "Find out what is happening inside the phone and charger you use every day.", "goal": "Understand batteries, voltage, electrical signals, motors and power use.", "road": ["W1 to 2: Peek inside a phone and read battery/charger labels.", "W3 to 4: Learn voltage, current, resistance and power.", "W5 to 6: Explore motors, microphones, generators and changing signals.", "W7 to 8: Understand signal energy, harmonics and electricity bills."], "task": "Compare the wattage and voltage printed on two chargers (no opening or electrical experiments).", "friction": "The maths of waves and signals may feel unfamiliar; begin with phone components.", "difficulty": "Medium–high", "verdict": "A practical topic, but circuit maths is a possible sticking point.", "category": "GADGETS", "emoji": "⚡", "world": "Noise-cancelling headphones, electric cars, wearable heart-rate sensors, and tiny satellites all rely on electronics.", "scene": "Your phone is not magic. It is an orchestra of circuits, sensors, and signals.", "kind": "Tech", "level": "challenging", "color": "#16a5ae", "index": 2, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=es", "image": "assets/es.svg"}, {"code": "ad", "name": "Introduction to Architecture and Design", "hook": "ROOM REMIX", "tag": "Redesign spaces that annoy you: and learn why some rooms just feel right.", "goal": "Play with shapes, colour, proportion, patterns and drawings of spaces.", "road": ["W1 to 2: Notice architecture; build shapes from points and lines.", "W3 to 4: Explore balance, scale and tangram compositions.", "W5 to 6: Study rhythm and patterns; sketch plans, elevations and perspectives.", "W7 to 8: Design logos and jaali patterns; pull a final design together."], "task": "Sketch your dream study corner with one change that makes it easier to use.", "friction": "No need to be “good at art” already; rough sketches count as thinking.", "difficulty": "Low–medium", "verdict": "Great for visual, creative learners.", "category": "DESIGN", "emoji": "🏛️", "world": "Architects create earthquake-aware buildings, shaded public spaces, and small homes that feel twice their size.", "scene": "What would you change about your classroom if you were the architect?", "kind": "Create", "level": "easy", "color": "#fc795e", "index": 3, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ad", "image": "assets/ad.svg"}, {"code": "bs", "name": "Introduction to Engineering Biological Systems", "hook": "BIOLOGY HACK LAB", "tag": "What if living cells could help make medicine or useful materials?", "goal": "Meet cells, microscopes, proteins, DNA and the idea of engineering biology.", "road": ["W1 to 2: Cells, microscopes and virtual biotech-lab tools.", "W3 to 4: How biological products are made; membranes and carbohydrates.", "W5 to 6: Proteins, enzymes, DNA and introductory bioinformatics.", "W7 to 8: PCR, genetic engineering and biological production."], "task": "Draw a “cell factory” that turns ingredients into something useful; label its jobs.", "friction": "DNA amplification, PCR and BLAST are names of tools, not prerequisites.", "difficulty": "Medium–high", "verdict": "Interesting if biology is already a favourite; technical words build up.", "category": "BIOTECH", "emoji": "🧬", "world": "Engineered microbes can produce medicines such as insulin, and bioengineers build tissue models to study diseases.", "scene": "Imagine a tiny factory that is alive. What would you ask it to make?", "kind": "Science", "level": "challenging", "color": "#69b88d", "index": 4, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=bs", "image": "assets/bs.svg"}, {"code": "mc", "name": "Fun with Math and Computing", "hook": "SECRET CODE CLUB", "tag": "How do computers search, keep secrets: and even count votes?", "goal": "Explore binary, fast searching, clever card tricks and cryptography.", "road": ["W1 to 2: Binary and other ways computers represent numbers.", "W3 to 4: Binary search, pattern matching and a 21-card trick.", "W5 to 6: Fair voting and why election rules can be tricky.", "W7 to 8: Codes, number theory and RSA-style security."], "task": "Play “guess my number” from 1 to 64 using yes/no questions; count how few guesses it takes.", "friction": "This is clever maths, not necessarily learning to code an app.", "difficulty": "Medium–high", "verdict": "Best for puzzle-lovers; abstract concepts appear later.", "category": "MATH & CODE", "emoji": "🔐", "world": "Encryption helps protect private messages, and clever search algorithms find results without checking everything.", "scene": "Crack the trick: Why can seven yes-or-no questions identify a number from 1 to 100?", "kind": "Puzzles", "level": "challenging", "color": "#516ee7", "index": 5, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=mc", "image": "assets/mc.svg"}, {"code": "gp", "name": "Math Unplugged: Games & Puzzles", "hook": "PUZZLE BOSS", "tag": "Chess puzzles, strange infinities and problems that still stump mathematicians.", "goal": "Think through chessboard tours, peg solitaire, infinities and playful proofs.", "road": ["W1 to 2: Try knight tours across differently sized boards.", "W3 to 4: Explore unusual chess moves and peg solitaire.", "W5 to 6: Visit the impossible infinite hotel; compare infinities.", "W7 to 8: Count areas with geometry; peek at unsolved problems."], "task": "Draw a 5×5 grid and see how far a chess knight can travel without repeating a square.", "friction": "Later lessons include graph theory and infinity ideas; getting stuck is normal.", "difficulty": "Medium–high", "verdict": "Excellent if she likes puzzles more than textbook maths.", "category": "PUZZLES", "emoji": "♞", "world": "Puzzle ideas connect to delivery routes, network design, logic games, and mathematical research.", "scene": "Can you solve a board game by finding a clever pattern instead of trying every move?", "kind": "Puzzles", "level": "challenging", "color": "#a478e8", "index": 6, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=gp", "image": "assets/gp.svg"}, {"code": "fe", "name": "The Fundamentals of Aerospace", "hook": "MISSION: MARS", "tag": "Why can planes fly, rockets launch, and satellites stay in orbit?", "goal": "Understand forces, airflow, engines, flight controls and space missions.", "road": ["W1 to 2: Types of aircraft; forces and how air acts on objects.", "W3 to 4: Wings, controls, speed and aircraft/rocket engines.", "W5 to 6: Orbits, a Mars trip, parachutes and safe landing.", "W7 to 8: Spinning wings and further flight applications."], "task": "Fold two paper plane designs and compare how far each flies in a safe open area.", "friction": "Words like drag and Mach number describe things you can first observe.", "difficulty": "Medium", "verdict": "Very visual with strong real-world payoffs.", "category": "SPACE & FLIGHT", "emoji": "🚀", "world": "Engineers design reusable rockets, drones for difficult terrain, and spacecraft that navigate between planets.", "scene": "You can test an idea about flight with just a sheet of paper.", "kind": "Science", "level": "curious", "color": "#f18d4c", "index": 7, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=fe", "image": "assets/fe.svg"}, {"code": "hu", "name": "Humanities Unplugged", "hook": "MEME DETECTIVE", "tag": "Can a meme, song or ad change the way you see the world?", "goal": "Decode pop culture, identity, online influence and storytelling.", "road": ["W1 to 2: Spot humanities in films and memes; decode cultural clues.", "W3 to 4: Map your story; trace storytelling from ancient to digital.", "W5 to 6: Analyse media bias, online identity and social change.", "W7 to 8: Connect creative thinking with future directions."], "task": "Choose a favourite meme or ad: what emotion is it trying to trigger?", "friction": "This is about thinking critically, not memorising history dates.", "difficulty": "Low", "verdict": "Accessible if she likes stories, social media or film.", "category": "CULTURE & MEDIA", "emoji": "🎭", "world": "Film analysts decode visual storytelling, researchers study internet culture, and journalists investigate how narratives spread.", "scene": "A meme is a tiny cultural message. What is yours really saying?", "kind": "Create", "level": "easy", "color": "#e76d9b", "index": 8, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=hu", "image": "assets/hu.svg"}, {"code": "ec", "name": "Introduction to Ecology", "hook": "NATURE TRACKER", "tag": "Become a detective for the plants, birds and tiny creatures around you.", "goal": "Track biodiversity using field observations, maps and real data.", "road": ["W1 to 2: Observe biodiversity, species and local habitats.", "W3 to 4: Create an iNaturalist-style observation project; compare regions.", "W5 to 6: Explore biodiversity data and evolution.", "W7 to 8: Study lizards, genes and the sounds of living things."], "task": "Photograph or sketch three different living things nearby, without disturbing them.", "friction": "Some data analysis uses spreadsheets; the outdoor observation comes first.", "difficulty": "Low–medium", "verdict": "Strong for a curious observer who enjoys being outside.", "category": "WILDLIFE", "emoji": "🦋", "world": "Citizen scientists photograph species to help researchers map biodiversity and understand changes in habitats.", "scene": "The area outside your home can become your first research site.", "kind": "Science", "level": "easy", "color": "#58ac6b", "index": 9, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ec", "image": "assets/ec.svg"}, {"code": "fm", "name": "Economics, Finance, and Money Matters", "hook": "MONEY MYTHBUSTERS", "tag": "Why do brands cost more, free things have catches, and prices rise?", "goal": "Explore money, inflation, risk, brands, trade and digital platforms.", "road": ["W1 to 2: Money, value, inflation and brand-price comparisons.", "W3 to 4: Incentives, risks and choices; probability exercises.", "W5 to 6: Trade, market failures and game theory.", "W7 to 8: Digital platforms and how technology changes markets."], "task": "Compare two similar products: what are you paying for besides the item?", "friction": "A little probability comes up, but most questions start in daily life.", "difficulty": "Low–medium", "verdict": "Relatable for someone interested in shopping or decisions.", "category": "MONEY", "emoji": "💸", "world": "Economists study why prices change, how apps design incentives, and why mple design concept and explore careers."], "task": "Redesign a school-bag zipper, water bottle or pencil case; sketch your better version.", "friction": "The site says “senior secondary” in its description, but lists eligibility for IX–XII.", "difficulty": "Low–medium", "verdict": "Good for creative problem-solvers; check the age-level mismatch.", "category": "INVENTIONS", "emoji": "🛠️", "world": "Product designers improve easy-grip kitchen tools, accessible controllers, sports equipment, and everyday packaging.", "scene": "Find the most annoying object you use every day. That is your first design brief.", "kind": "Create", "level": "easy", "color": "#fb748e", "index": 12, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ipd", "image": "assets/ipd.svg"}, {"code": "mle", "name": "Molecular Engineering: Opportunities and Challenges", "hook": "INVISIBLE MATERIALS", "tag": "Why can tiny molecules change colour, power screens or improve medicine?", "goal": "Explore how molecules are built and how they make useful materials.", "road": ["W1 to 2: Simple/complex molecules and why things have colours.", "W3: How scientists investigate reactions and interactions.", "W4 to 6: Sensors, displays, medical imaging and solar energy.", "W7 to 8: How to study chemistry and possible careers."], "task": "Pick one colourful object or LED and sketch questions about the materials inside it.", "friction": "Molecular interactions can feel abstract without a chemistry interest.", "difficulty": "High", "verdict": "Better if she already enjoys chemistry.", "category": "MOLECULES", "emoji": "🔬", "world": "Molecular engineering helps develop OLED displays, chemical sensors, battery materials, and advanced medical tools.", "scene": "The smallest building blocks can make the biggest difference in what a material does.", "kind": "Science", "level": "challenging", "color": "#35a4b4", "index": 13, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=mle", "image": "assets/mle.svg"}, {"code": "ics", "name": "Introduction to Cybersecurity", "hook": "DIGITAL BODYGUARD", "tag": "How do hackers trick people: and how can you protect your accounts?", "goal": "Passwords, secret codes, how the internet works and common attacks.", "road": ["Module 1: What cybersecurity protects.", "Module 2: Secrets and cryptography.", "Module 3: Passwords and logging in securely.", "Modules 4 to 5: Internet basics and popular cyberattacks."], "task": "Make a fake phishing-message checklist: identify suspicious links, urgency and strange senders.", "friction": "No hacking experience needed; the website describes about 10 hours of content.", "difficulty": "Low–medium", "verdict": "High everyday relevance and clear short modules.", "category": "CYBER SAFETY", "emoji": "🛡️", "world": "Security teams stop phishing attacks, protect accounts, and build systems that keep personal information private.", "scene": "Could you spot a fake login page before it steals a password?", "kind": "Tech", "level": "easy", "color": "#4b8feb", "index": 14, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ics", "image": "assets/ics.svg"}, {"code": "idh", "name": "Introduction to Digital Humanities", "hook": "TECH + CULTURE LAB", "tag": "What do games, AI, maps and stories reveal about people?", "goal": "Explore AI bias, immersive worlds, games, digital maps and portfolios.", "road": ["M1 to 2: Digital humanities and bias in algorithms.", "M3 to 4: AR/VR/XR and games as cultural stories.", "M5 to 6: Learning games, mapping and digital storytelling.", "M7 to 8: Build a digital portfolio; explore futures."], "task": "Map three places that matter to a fictional character and tell their story through them.", "friction": "Official page says no coding required and free browser tools.", "difficulty": "Low–medium", "verdict": "Very accessible for someone who likes tech without programming.", "category": "DIGITAL STORIES", "emoji": "🌐", "world": "Museums create interactive archives, researchers build historical maps, and artists explore AI and digital storytelling.", "scene": "What happens when you tell a story with a map instead of an essay?", "kind": "Create", "level": "easy", "color": "#ad76eb", "index": 15, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=idh", "image": "assets/idh.svg"}, {"code": "ifs", "name": "Introduction to Forensic Sciences - I (For Classes IX & X)", "hook": "CASE FILE: YOU", "tag": "Fingerprint clues, suspicious messages and evidence that tells a story.", "goal": "Investigate prints, DNA, documents, digital evidence and crime scenes.", "road": ["W1 to 2: Crime-scene clues and your fingerprints.", "W3 to 4: Trace evidence, scene sketches and DNA investigation.", "W5 to 6: Handwriting, language, manipulated digital evidence.", "W7 to 8: Other evidence types and interpreting findings."], "task": "Create a fictional crime scene in a shoebox and draw an evidence map.", "friction": "The website says four expert-interview podcasts each week, hands-on work and Saturday live discussion: no conventional lectures.", "difficulty": "Low–medium", "verdict": "Possibly the best match for a reluctant learner who likes mysteries.", "category": "FORENSICS", "emoji": "🔎", "world": "Forensic teams compare fingerprints, study documents, analyse digital traces, and reconstruct what happened at a scene.", "scene": "A clue only helps if you can explain what it proves, and what it does not.", "kind": "Everyday", "level": "easy", "color": "#eaa24a", "index": 16, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ifs", "image": "assets/ifs.svg"}, {"code": "ifs2", "name": "Introduction to Forensic Sciences - II (For Classes XI & XII)", "hook": "FORENSICS CAREER MAP", "tag": "What does a real forensic scientist do all day?", "goal": "Meet forensic careers and learn pathways into lab, biology and other specialisms.", "road": ["W1 to 2: Forensic job families and laboratory career routes.", "W3 to 4: DNA lab and medicine-related pathways.", "W5 to 6: Other professional pathways and evidence-based decisions.", "W7 to 8: Career planning and defending an expert view."], "task": "Compare two forensic jobs: which daily tasks sound more interesting?", "friction": "NOT FOR GRADE 9: the official title restricts this one to Classes XI–XII.", "difficulty": "Not age-appropriate", "verdict": "Keep for later; choose Forensic Sciences I instead.", "category": "CAREERS", "emoji": "🧪", "world": "Forensic specialists work in labs, digital analysis, toxicology, and evidence interpretation.", "scene": "Do you prefer solving the science puzzle or presenting the evidence?", "kind": "Everyday", "level": "older", "color": "#77a7dc", "index": 17, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ifs2", "image": "assets/ifs2.svg"}, {"code": "bddi", "name": "Our Defense System: How Our Body Detects and Defeats Invaders", "hook": "BODY DEFENCE SQUAD", "tag": "Your body has guards, rapid responders and specialists fighting invisible threats.", "goal": "Discover immunity, antibodies, vaccines, immune memory and what goes wrong.", "road": ["Part 1: Body barriers and your fast-response immune team.", "Part 2: Adaptive immunity and antibody specialists.", "Part 3: Vaccines, memory and misfires.", "Part 4: Colds, fever, discoveries and immunology careers."], "task": "Draw the immune system as a game team: shield, scout, fighter and memory keeper.", "friction": "“Innate” means ready-made defence; “adaptive” means a more targeted response.", "difficulty": "Medium", "verdict": "Promising for someone who likes health or body science.", "category": "IMMUNITY", "emoji": "🦠", "world": "Immunologists help develop vaccines, study allergies, and investigate how the body recognises threats.", "scene": "Your body runs its own defence team, even while you are asleep.", "kind": "Science", "level": "curious", "color": "#69bfad", "index": 18, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=bddi", "image": "assets/bddi.svg"}, {"code": "ftnc", "name": "From Statistics to Intelligence (For Classes XI & XII)", "hook": "DATA TRUTH DETECTOR", "tag": "Can averages mislead you? How do prediction apps guess what comes next?", "goal": "Study probability, surveys, misleading charts, prediction and AI.", "road": ["W1 to 2: Chance and biased surveys.", "W3 to 4: Averages, variation and big data patterns.", "W5 to 6: Conditional probability, correlations and predictions.", "W7 to 8: Data science, AI and possible careers."], "task": "Find two charts about the same topic and notice how their scales change the story.", "friction": "NOT FOR GRADE 9: explicitly intended for XI–XII, with advanced statistics.", "difficulty": "Not age-appropriate", "verdict": "Save for later; try Data Science and AI instead.", "category": "STATISTICS", "emoji": "📊", "world": "Statisticians help forecast demand, spot misleading surveys, and check whether a medical study is convincing.", "scene": "Can one chart tell a lie without containing a single false number?", "kind": "Puzzles", "level": "older", "color": "#6e85ef", "index": 19, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=ftnc", "image": "assets/ftnc.svg"}, {"code": "de", "name": "Discover Engineering", "hook": "EVERYDAY INVENTOR", "tag": "Find one thing that bothers people: and engineer a better version.", "goal": "Explore how engineers solve problems with science, creativity and teamwork.", "road": ["W1 to 2: Find engineering in everyday objects and the science inside.", "W3 to 4: Big engineering achievements and human needs.", "W5 to 6: How engineers work; choose a problem worth solving.", "W7 to 8: Develop an idea and present a short video pitch."], "task": "Find an annoying everyday object; explain the problem in 30 seconds before suggesting a fix.", "friction": "The goal is not to know all physics: start by noticing a problem.", "difficulty": "Low–medium", "verdict": "Broad, practical and friendly for beginners.", "category": "ENGINEERING", "emoji": "⚙️", "world": "Engineers create clean-water systems, safer roads, assistive technology, and solutions to everyday problems.", "scene": "Engineering begins with the sentence: This could work better.", "kind": "Everyday", "level": "easy", "color": "#f27857", "index": 20, "link": "https://code.iitm.ac.in/schoolconnect/course-details?course=de", "image": "assets/de.svg"}];
const state={filter:'All',search:'',favorites:JSON.parse(localStorage.getItem('doorFavorites')||'[]'),explored:JSON.parse(localStorage.getItem('doorExplored')||'[]')};
const kinds=['All','Tech','Create','Science','Puzzles','Everyday','Saved'];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),2300)}
function markSaved(code){let i=state.favorites.indexOf(code);if(i<0)state.favorites.push(code);else state.favorites.splice(i,1);localStorage.setItem('doorFavorites',JSON.stringify(state.favorites));render();toast(i<0?'Saved to your doors':'Removed from saved doors')}
function markDone(code){let i=state.explored.indexOf(code);if(i<0)state.explored.push(code);else state.explored.splice(i,1);localStorage.setItem('doorExplored',JSON.stringify(state.explored));render();toast(i<0?'Marked as explored!':'Marked as not explored')}
function nav(code){location.hash=code?'#/course/'+code:'#/';window.scrollTo({top:0,behavior:'instant'});render()}
function card(c){return `<article class="doorcard" style="--c:${c.color}"><button class="doortap" onclick="nav('${c.code}')" aria-label="Open ${esc(c.name)}"><div class="doorvisual"><span class="doorindex">DOOR ${String(c.index).padStart(2,'0')}</span><div class="doorframe"><div class="doorpanel"><span class="em">${c.emoji}</span><span class="knob"></span></div></div><span class="doorfoot">OPEN ↗</span></div><div class="cardmeta"><span>${esc(c.category)}</span><span class="smalltag ${c.level==='older'?'notfor':''}">${c.level==='older'?'CLASS XI–XII':c.difficulty}</span></div><h3 class="ctitle">${esc(c.hook)}</h3><p class="cname">${esc(c.name)}</p><div class="cardbottom"><span>Step inside ↗</span></div></button><button class="heart ${state.favorites.includes(c.code)?'active':''}" onclick="markSaved('${c.code}')" aria-label="${state.favorites.includes(c.code)?'Remove':'Save'} ${esc(c.name)}">${state.favorites.includes(c.code)?'♥':'♡'}</button></article>`}
function header(){return `<header class="shell topbar"><a class="brand" href="#/" onclick="event.preventDefault();nav()"><span class="brandmark">⌁</span> THE DOORWAY <span style="font-size:9px;color:#9a9fb7;letter-spacing:1px">/ SCHOOL CONNECT</span></a><div class="topright"><span class="pill">20 doors · 8 weeks each</span><button onclick="nav()">Explore all ↗</button></div></header>`}
function home(){let list=courses.filter(c=>(state.filter==='All'||(state.filter==='Saved'?state.favorites.includes(c.code):state.filter===c.kind))&&(!state.search||[c.hook,c.name,c.tag,c.category,c.goal].join(' ').toLowerCase().includes(state.search.toLowerCase())));app.innerHTML=header()+`<main id="main" class="shell"><section class="hero"><div class="eyebrow">IIT Madras School Connect · Subject Explorer</div><h1>20 doors.<br><em>Your next obsession</em><br>might be behind one.</h1><p>Forget intimidating course descriptions. Pick a door that looks interesting, peek inside, try something tiny, and see if the subject clicks. No pressure to love every room.</p><div class="stats"><span class="stat">🚪 <strong>20</strong> subjects</span><span class="stat">⏱ <strong>8 weeks</strong> per course</span><span class="stat">✨ Made for the <strong>curious</strong></span><span class="stat highlight">⚠️ 2 courses are for Grades 11–12</span></div></section><div class="bar"><label class="search">⌕ <input type="search" id="search" placeholder="Search a vibe, hobby or subject..." value="${esc(state.search)}" oninput="updateSearch(this.value)" aria-label="Search courses"></label><div class="filters" role="group" aria-label="Course filters">${kinds.map(k=>`<button class="filter ${state.filter===k?'on':''}" onclick="setFilter('${k}')">${k==='Saved'?'♡ ':''}${k}</button>`).join('')}</div></div><div class="sectionhead"><h2 id="resulthead">Choose a door</h2><span id="resultcount">${list.length} of 20 showing</span></div><section class="doorgrid" id="doorgrid" aria-label="Course doors">${list.length?list.map(card).join(''):'<div class="empty no-results">No doors match that search. Try something else.</div>'}</section><div class="contentbox" style="margin-bottom:35px"><div class="minihead">A quick note for the grown-ups</div><p>This is a friendly guide to help a Grade 9 student discover interests, not a replacement for official course requirements. Two courses are labelled for Classes XI–XII, and some subjects are more technical than others. Follow the official page links before enrolling. The real-world examples are illustrations of the field, not projects promised by the course.</p></div></main>`+footer();}
function updateSearch(v){state.search=v;let list=courses.filter(c=>(state.filter==='All'||(state.filter==='Saved'?state.favorites.includes(c.code):state.filter===c.kind))&&(!state.search||[c.hook,c.name,c.tag,c.category,c.goal].join(' ').toLowerCase().includes(state.search.toLowerCase())));document.getElementById('doorgrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty no-results">No doors match that search. Try something else.</div>';document.getElementById('resultcount').textContent=list.length+' of 20 showing'}
function setFilter(k){state.filter=k;home();document.querySelector('#search')?.focus({preventScroll:true})}
function footer(){return `<footer class="shell footer">Made for exploring, not cramming. Based on the provided IIT Madras School Connect course list and course guide. Course information should be confirmed on the <a href="https://code.iitm.ac.in/schoolconnect/" target="_blank" rel="noopener">official website</a>. Individual pages include official links. All artwork is included locally. ✦</footer>`}
function detail(c){let i=courses.findIndex(x=>x.code===c.code),prev=courses[i-1],next=courses[i+1],warnings=c.level==='older'?`<div class="warning">⚠️ This course is specifically labelled for Classes XI–XII. It is shown for comparison, but is not intended for a Grade 9 student.</div>`:c.code==='ipd'?`<div class="warning">⚠️ The course page describes senior-secondary learners while general eligibility includes IX–XII. Check with the programme before registering.</div>`:'';app.innerHTML=`<div class="course" style="--theme:${c.color}">${header()}<main id="main" class="shell"><div class="coursebar"><button class="back" onclick="nav()">← All 20 doors</button><div class="navsmall">DOOR ${c.index} OF 20 <button ${!prev?'disabled':''} onclick="nav('${prev?prev.code:c.code}')" aria-label="Previous course">←</button><button ${!next?'disabled':''} onclick="nav('${next?next.code:c.code}')" aria-label="Next course">→</button></div></div><section class="coursehero"><div><div class="eyebrow">${esc(c.category)} / An 8-week adventure</div><h1>${esc(c.hook)}</h1><div class="subtitle">${esc(c.name)}</div><p class="bigquestion">${esc(c.tag)}</p><div class="detailchips"><span>📅 8 weeks</span><span>🧭 ${esc(c.difficulty)}</span><span>${c.level==='older'?'⚠️ Grades 11–12':'✨ Explore at your pace'}</span></div>${warnings}</div><img src="${c.image}" alt="Illustrated artwork featuring ${esc(c.emoji)} for ${esc(c.name)}"></section><section class="coursebody"><div><article class="contentbox"><div class="minihead">01 / So what is it actually about?</div><h2>The fun part, explained</h2><p>${esc(c.goal)}</p><div class="quote">“${esc(c.scene)}”</div></article><article class="contentbox"><div class="minihead">02 / Your adventure map</div><h2>What you'll explore</h2><p>Here's the course content in human language. Some courses organise topics into modules rather than exact two-week blocks.</p><div class="weeklist">${c.road.map((s,j)=>`<div class="week"><span class="weeknum">${String(j+1).padStart(2,'0')}</span><p>${esc(s)}</p></div>`).join('')}</div></article><article class="contentbox activity"><div class="minihead">03 / Try before you commit</div><h2>Your 10-minute side quest</h2><p>${esc(c.task)}</p><button class="donebtn ${state.explored.includes(c.code)?'done':''}" onclick="markDone('${c.code}')">${state.explored.includes(c.code)?'✓ Explored this door':'✓ I tried this!'}</button><div class="progressbar"><div style="width:${state.explored.length/20*100}%"></div></div><p class="hint" style="margin-top:9px">${state.explored.length} of 20 subjects explored. Your progress stays in this browser.</p></article></div><aside class="sidebar"><article class="contentbox"><div class="minihead">04 / The wow factor</div><h2>Cool things people do in this field</h2><p>${esc(c.world)}</p><p class="fineprint">These are real-world examples of the field, not specific course project promises.</p></article><article class="contentbox"><div class="minihead">05 / Do not panic</div><h2>Weird words decoded</h2><div class="callout"><div class="callouticon">💡</div><p>${esc(c.friction)}</p></div></article><article class="contentbox"><div class="fit">The fit check</div><div class="quote">${esc(c.difficulty)}</div><p>${esc(c.verdict)}</p><button class="donebtn ${state.favorites.includes(c.code)?'done':''}" onclick="markSaved('${c.code}')">${state.favorites.includes(c.code)?'♥ Saved to favorites':'♡ Save this course'}</button></article><article class="contentbox"><div class="minihead">Official information</div><p>For the exact syllabus, teacher, enrolment eligibility, deadlines, assessment and certificate details, use the IIT Madras course page.</p><a class="external" target="_blank" rel="noopener" href="${c.link}">View official course ↗</a></article></aside></section></main>${footer()}</div>`;document.title=c.hook+' | The Doorway'}
function render(){let m=location.hash.match(/^#\/course\/([\w]+)$/);let c=m?courses.find(x=>x.code===m[1]):null;if(c)detail(c);else{document.title='The Doorway | 20 course adventures';home()}}
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'})});render();
</script></body></html>
